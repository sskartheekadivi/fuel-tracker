name: Update Fuel Prices

on:
  schedule:
    - cron: '0 1 * * *' # 6:30 AM IST (1:00 AM UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Fetch Prices
        run: python scripts/fetch_prices.py
        
      - name: Process Data
        run: python scripts/process_data.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update fuel prices" && git push)
